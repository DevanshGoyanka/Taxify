name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual re-deploy from the Actions tab

# Rapid pushes must not race each other on the box.
concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: write           # create the Release that carries the frontend bundle
  id-token: write           # request the OIDC token used to assume the AWS role

env:
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-06fa754bdb98c95af
  ROLE_ARN: arn:aws:iam::938509046486:role/taxify-gha-deploy
  API_BASE_URL: https://itrbharo.duckdns.org

jobs:
  # Most pushes touch app/ only. Skipping the npm build turns a ~3 min deploy
  # into ~30 s, which matters far more than trigger latency.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # MUST be set explicitly. paths-filter defaults `base` to the repository
          # DEFAULT branch, which for this repo is `master` — a stale, wildly
          # divergent line of work. Comparing against it marks every file as
          # changed, so the filter never skips and the npm build always runs.
          # github.event.before is the commit this push moved from.
          base: ${{ github.event.before }}
          filters: |
            frontend:
              - 'frontend/**'

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          # VITE_API_BASE_URL is baked in at build time, not read at runtime.
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf ../dist.tar.gz -C dist .

      - name: Publish release asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist.tar.gz \
            --title "$TAG" \
            --notes "Frontend bundle for ${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [changes, build-frontend]
    # run even when build-frontend was skipped (backend-only push)
    if: always() && needs.changes.result == 'success' && needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          TAG: ${{ needs.build-frontend.outputs.tag }}
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "gha ${GITHUB_SHA::7}" \
            --parameters "commands=[\"bash /opt/taxify/deploy.sh ${TAG}\"]" \
            --query 'Command.CommandId' --output text)
          echo "ssm command: $CMD"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "--- deploy output ---"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          ERR=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "--- stderr ---"; echo "$ERR"
          fi

          echo "final status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Verify the site is serving
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE_URL/health")
          echo "GET /health -> $CODE"
          [ "$CODE" = "200" ]
