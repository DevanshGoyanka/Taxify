# Local DSC Signing Service Configuration
# Runs on Windows laptop with USB DSC token

server:
  port: 9090
  address: 0.0.0.0

spring:
  application:
    name: local-dsc-signer

# DSC Token Configuration
dsc:
  token:
    driver-path: "C:\\Windows\\System32\\eps2003csp11v2.dll"
    pin: "123456789"

# Logging
logging:
  level:
    root: INFO
    com.taxerp.signer: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [CMS-SIGNER] %-5level %logger{36} - %msg%n"