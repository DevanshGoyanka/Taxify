    <!-- Crawlers and users without JavaScript would otherwise receive an empty
         document. This states the brand and purpose in real HTML. It is hidden
         the moment the app mounts, so it never affects the live UI. -->
    <noscript>
      <main>
        <h1>ITR Bharo — Income Tax Return Filing</h1>
        <p>
          ITR Bharo is a web application for computing and filing Indian income tax
          returns. It supports ITR-1, ITR-2, ITR-3 and ITR-4 for assessment year
          2026-27.
        </p>
        <h2>What ITR Bharo does</h2>
        <ul>
          <li>Computes tax under the Finance Act 2025 rules for AY 2026-27</li>
          <li>Imports AIS, TIS and Form 26AS and reconciles them against the return</li>
          <li>Generates CBDT-compliant ITR JSON for filing</li>
          <li>Manages multiple clients and their returns across assessment years</li>
        </ul>
        <p>
          This application requires JavaScript. Please enable JavaScript to sign in
          at <a href="https://itrbharo.duckdns.org/login">itrbharo.duckdns.org/login</a>.
        </p>
